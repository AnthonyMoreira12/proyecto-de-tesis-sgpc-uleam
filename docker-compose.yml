version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: sgpc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-SGPC_FCVT_2}
      POSTGRES_USER: ${DB_USER:-postgres}
      # Extrae la contraseña del archivo .env que TI colocará en el servidor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Servidor de Caché (Redis)
  redis:
    image: redis:alpine
    container_name: sgpc_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Nuestro Backend (Django)
  backend:
    build:
      context: ./BACKEND_SGPC_FCVT
    container_name: sgpc_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-SGPC_FCVT_2}
      - DB_USER=${DB_USER:-postgres}
      # Extrae la contraseña dinámicamente
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/1
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  # 4. Nuestro Frontend (Vue + Nginx)
  frontend:
    build:
      context: ./FRONTEND_SGPC_FCVT
    container_name: sgpc_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  media_data: