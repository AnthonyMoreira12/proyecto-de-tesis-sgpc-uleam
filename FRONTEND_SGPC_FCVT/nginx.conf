server {
    listen 80;
    server_name localhost;

    # Sirve los archivos estáticos de Vue
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Esto es vital para que funcione el Vue Router sin errores 404
        try_files $uri $uri/ /index.html;
    }

    # Redirige las peticiones /api/ directamente al contenedor del backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige la subida/lectura de archivos PDF e imágenes
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }
}